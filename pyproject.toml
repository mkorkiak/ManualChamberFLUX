[build-system]
requires = ["setuptools>=65.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ManualChamberFLUX"
version = "1.5.5"
authors = [
  { name="Mika Korkiakoski", email="mika.korkiakoski@fmi.fi" },
]
description = "Calculates CO2, CH4 and N2O fluxes from manual chamber measurements."
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = ['alive-progress',
                'matplotlib>=3.11.2',
                'numpy>=2.5.5',
                'pandas>=3.1.1',
                'scipy>=1.18.1',
                'openpyxl>=3.1.5',
                'mplcursors>=0.7.1'
                ]

[project.urls]
"Homepage" = "https://github.com/mkorkiak/ManualChamberFLUX"
"Bug Tracker" = "https://github.com/mkorkiak/ManualChamberFLUX/issues"
